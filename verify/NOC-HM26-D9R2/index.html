<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Certificate Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #525659;
      font-family: Arial, sans-serif;
    }
    #status {
      color: white;
      padding: 16px;
      text-align: center;
    }
    #viewer {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto 12px;
      background: white;
    }
    a { color: white; }
  /* VERIFY-WHITE-BACKGROUND */
html, body {
    background: #ffffff !important;
}
</style>
</head>
<body>
  <div id="status">Loading certificate...</div>
  <main id="viewer"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const pdfUrl = "../../heema/NOC-HM26-D9R2.pdf";
    const status = document.getElementById("status");
    const viewer = document.getElementById("viewer");

    if (typeof pdfjsLib === "undefined") {
      status.textContent = "The certificate viewer could not load. Check your internet connection.";
    } else {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      pdfjsLib.getDocument(pdfUrl).promise.then(async pdf => {
        status.textContent = "";

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const base = page.getViewport({ scale: 1 });
          const scale = Math.min(window.innerWidth / base.width, 2);
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          const outputScale = Math.max(window.devicePixelRatio || 1, 1);

          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = "100%";
          canvas.style.height = "auto";
          viewer.appendChild(canvas);

          await page.render({
            canvasContext: context,
            viewport: viewport,
            transform: outputScale !== 1
              ? [outputScale, 0, 0, outputScale, 0, 0]
              : null
          }).promise;
        }
      }).catch(error => {
        console.error(error);
        status.textContent = "Could not display the certificate. Try refreshing the page.";
      });
    }
  </script>
</body>
</html>
